name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dossier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - name: python hook tests
        run: python3 plugins/dossier/hooks/test_python.py

      - name: shell helper + marker-guard tests
        run: |
          bash plugins/dossier/hooks/test_marker_guard.sh
          bash plugins/dossier/hooks/test_lib_dossier_edit.sh
          bash plugins/dossier/hooks/test_lib_regen.sh
          bash plugins/dossier/hooks/test_session_start.sh
          bash plugins/dossier/hooks/test_lib_archive_move.sh
          bash plugins/dossier/hooks/test_lib_reconcile.sh
          bash plugins/dossier/hooks/test_lib_clear_locks.sh
          bash plugins/dossier/hooks/test_lib_ds_check.sh
          bash plugins/dossier/hooks/test_lib_z_write.sh
          bash plugins/dossier/hooks/test_lib_assert_scaffold.sh
          bash plugins/dossier/hooks/test_lib_vm_checks.sh
          bash plugins/dossier/hooks/test_closure_parity.sh
          bash plugins/dossier/hooks/test_vm6_parity.sh
          bash plugins/dossier/hooks/test_build_doubt_gate.sh
          bash plugins/dossier/hooks/test_manifest.sh
          bash plugins/dossier/hooks/test_lib_assert_grill.sh
          bash plugins/dossier/hooks/test_lib_changelog_write.sh
          bash plugins/dossier/hooks/test_skill_gate.sh
          bash plugins/dossier/hooks/test_tdd_compose.sh
          bash plugins/dossier/hooks/test_merge_route.sh
          bash plugins/dossier/hooks/test_flake_triage.sh
          bash plugins/dossier/hooks/test_skill_lint_gate.sh
          bash plugins/dossier/hooks/test_loop_rails.sh
          bash plugins/dossier/hooks/test_fakeimpl_stop.sh

      - name: skill lint (all dossier skills)
        run: python3 plugins/whetstone/skills/skill-smith/scripts/lint_skill.py plugins/dossier/skills

      - name: first-party manifest + skill validation
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.220
          claude plugin validate plugins/dossier
          claude plugin validate plugins/whetstone
          claude plugin validate .

      - name: ruff
        run: |
          pip install -r requirements-dev.txt
          ruff check plugins/dossier/hooks

      - name: shellcheck
        env:
          # renovate: datasource=github-releases depName=koalaman/shellcheck
          SHELLCHECK_VERSION: "v0.11.0"
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ
          sudo mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep "version: ${SHELLCHECK_VERSION#v}"
          shellcheck plugins/dossier/hooks/*.sh

  whetstone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - name: python helper tests
        run: python3 plugins/whetstone/tests/test_whetstone_py.py

      - name: shell script tests
        run: |
          bash plugins/whetstone/tests/test_flake_runner.sh
          bash plugins/whetstone/tests/test_verify_clean.sh
          bash plugins/whetstone/tests/test_run_slice.sh
          bash plugins/whetstone/tests/test_dossier_breadcrumb.sh

      - name: skill lint (self-hosted)
        run: python3 plugins/whetstone/skills/skill-smith/scripts/lint_skill.py plugins/whetstone/skills

      - name: ruff
        run: |
          pip install -r requirements-dev.txt
          ruff check plugins/whetstone

      - name: shellcheck
        env:
          # renovate: datasource=github-releases depName=koalaman/shellcheck
          SHELLCHECK_VERSION: "v0.11.0"
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ
          sudo mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep "version: ${SHELLCHECK_VERSION#v}"
          shellcheck plugins/whetstone/skills/*/scripts/*.sh plugins/whetstone/tests/*.sh
