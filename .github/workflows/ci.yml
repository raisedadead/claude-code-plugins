name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dossier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: command tests
        run: node --test plugins/dossier/tests/test_ds_cli.ts plugins/dossier/tests/test_whetstone_allowlist.ts plugins/dossier/tests/test_converge.ts plugins/dossier/tests/test_convergence_state.ts plugins/dossier/tests/test_verify.ts plugins/dossier/tests/test_skill_routing.ts

      - name: shell helper tests
        run: |
          bash plugins/dossier/hooks/test_lib_dossier_edit.sh
          bash plugins/dossier/hooks/test_lib_regen.sh
          bash plugins/dossier/hooks/test_session_start.sh
          bash plugins/dossier/hooks/test_lib_archive_move.sh
          bash plugins/dossier/hooks/test_lib_reconcile.sh
          bash plugins/dossier/hooks/test_lib_clear_locks.sh
          bash plugins/dossier/hooks/test_lib_ds_check.sh
          bash plugins/dossier/hooks/test_lib_z_write.sh
          bash plugins/dossier/hooks/test_lib_assert_scaffold.sh
          bash plugins/dossier/hooks/test_lib_vm_checks.sh
          bash plugins/dossier/hooks/test_closure_parity.sh
          bash plugins/dossier/hooks/test_vm6_parity.sh
          bash plugins/dossier/hooks/test_pause_class_parity.sh
          bash plugins/dossier/hooks/test_manifest.sh
          bash plugins/dossier/hooks/test_lib_assert_grill.sh
          bash plugins/dossier/hooks/test_lib_changelog_write.sh
          bash plugins/dossier/hooks/test_fakeimpl_stop.sh

      - name: skill lint (all dossier skills)
        run: plugins/whetstone/bin/lint-skill plugins/dossier/skills

      - name: positive-rails ceiling
        run: |
          pattern='\bnever\b|\bdo not\b|\bdon.t\b|\bmust not\b'
          files='plugins/dossier/skills/build/SKILL.md plugins/dossier/agents/dossier-reviewer.md CLAUDE.md'
          test "$(grep -oiE "$pattern" plugins/dossier/skills/build/SKILL.md | wc -l)" -le 13
          test "$(grep -oiE "$pattern" plugins/dossier/agents/dossier-reviewer.md | wc -l)" -le 9
          test "$(grep -oiE "$pattern" CLAUDE.md | wc -l)" -le 1
          # ds:close archives a tracked contract, so look in both homes.
          contract=$(find .dossier -maxdepth 1 -name '*positive-rails*.md' 2>/dev/null | LC_ALL=C sort | head -n 1)
          if [ -z "$contract" ]; then
            contract=$(find .dossier/_archive -maxdepth 1 -name '*positive-rails*.md' 2>/dev/null | LC_ALL=C sort | head -n 1)
          fi
          if [ -z "$contract" ]; then
            echo "no positive-rails contract under .dossier/ or .dossier/_archive/" >&2
            exit 1
          fi
          rows=$(sed -n '/^## survivors/,/^## what changes/p' "$contract" | grep -c -e '| fact' -e '| guarded' -e '| hatch' || true)
          # shellcheck disable=SC2086
          total=$(grep -oiE "$pattern" $files | wc -l | tr -d ' ')
          if [ "$rows" -ne "$total" ]; then
            echo "$contract lists $rows survivors; the rails carry $total occurrences" >&2
            exit 1
          fi

      - name: every test file is named in this workflow
        run: |
          # Three suites once existed, passed locally, and ran nowhere.
          missing=0
          while IFS= read -r t; do
            grep -qF "$t" .github/workflows/ci.yml || { echo "not named in CI: $t" >&2; missing=1; }
          done < <(git ls-files 'plugins/*/tests/test_*' 'plugins/*/hooks/test_*' 'tools/test_*' 'tools/*/test_*')
          test "$missing" -eq 0

      - name: research ledger row shape
        run: |
          python3 tools/test_check_rows.py
          python3 tools/check_rows.py

      - name: census notification join
        run: python3 tools/census/test_census.py

      - name: first-party manifest + skill validation
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.287
          claude plugin validate plugins/dossier
          claude plugin validate plugins/whetstone
          claude plugin validate .

      - name: mod tests
        run: claude plugin test plugins/dossier

      - name: ruff
        run: |
          pip install -r requirements-dev.txt
          ruff check plugins/dossier tools

      - name: shellcheck
        env:
          # renovate: datasource=github-releases depName=koalaman/shellcheck
          SHELLCHECK_VERSION: "v0.11.0"
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ
          sudo mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep "version: ${SHELLCHECK_VERSION#v}"
          shellcheck plugins/dossier/hooks/*.sh

  whetstone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: command tests
        run: node --test plugins/whetstone/tests/test_tiger_check.ts plugins/whetstone/tests/test_lint_skill_cli.ts

      - name: shell script tests
        run: |
          bash plugins/whetstone/tests/test_flake_runner.sh
          bash plugins/whetstone/tests/test_verify_clean.sh
          bash plugins/whetstone/tests/test_run_slice.sh
          bash plugins/whetstone/tests/test_claim_check_cli.sh
          bash plugins/whetstone/tests/test_bin_wrappers.sh

      - name: skill lint (self-hosted)
        run: plugins/whetstone/bin/lint-skill plugins/whetstone/skills

      - name: mod tests
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.287
          claude plugin test plugins/whetstone

      - name: claim-check
        run: |
          git ls-files '*.md' | grep -v tests/fixtures/ \
            | xargs plugins/whetstone/bin/claim-check

      - name: shellcheck
        env:
          # renovate: datasource=github-releases depName=koalaman/shellcheck
          SHELLCHECK_VERSION: "v0.11.0"
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ
          sudo mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep "version: ${SHELLCHECK_VERSION#v}"
          shellcheck plugins/whetstone/skills/*/scripts/*.sh plugins/whetstone/tests/*.sh plugins/whetstone/bin/*
